<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background: #0f172a; font-family: ui-monospace, Menlo, Consolas, monospace;">
    <defs>
        <linearGradient id="parseGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        <linearGradient id="strGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
    </defs>

    <!-- Titre -->
    <text x="60" y="36" fill="#f8fafc" font-size="18" font-weight="bold">🚀 XML-AIRSTREAM : Performance &amp; Test de charge</text>
    <text x="60" y="54" fill="#94a3b8" font-size="12">Temps d'exécution (ms) en fonction du volume d'objets traités</text>

    <!-- Légende -->
    <rect x="550" y="25" width="12" height="12" fill="#38bdf8" rx="2" />
    <text x="570" y="36" fill="#cbd5e1" font-size="12">Parse (XML -> Objet)</text>

    <rect x="550" y="45" width="12" height="12" fill="#34d399" rx="2" />
    <text x="570" y="56" fill="#cbd5e1" font-size="12">Stringify (Objet -> XML)</text>

    <!-- Grille & Axe Y -->
    
        <line x1="60" y1="390" x2="740" y2="390" stroke="#334155" stroke-dasharray="4" />
        <text x="50" y="394" fill="#64748b" font-size="11" text-anchor="end">0ms</text>
        
        <line x1="60" y1="307.5" x2="740" y2="307.5" stroke="#334155" stroke-dasharray="4" />
        <text x="50" y="311.5" fill="#64748b" font-size="11" text-anchor="end">279ms</text>
        
        <line x1="60" y1="225" x2="740" y2="225" stroke="#334155" stroke-dasharray="4" />
        <text x="50" y="229" fill="#64748b" font-size="11" text-anchor="end">558ms</text>
        
        <line x1="60" y1="142.5" x2="740" y2="142.5" stroke="#334155" stroke-dasharray="4" />
        <text x="50" y="146.5" fill="#64748b" font-size="11" text-anchor="end">837ms</text>
        
        <line x1="60" y1="60" x2="740" y2="60" stroke="#334155" stroke-dasharray="4" />
        <text x="50" y="64" fill="#64748b" font-size="11" text-anchor="end">1116ms</text>
        

    <!-- Axe X (Nombre d'objets) -->
    
        <line x1="128" y1="390" x2="128" y2="396" stroke="#64748b" />
        <text x="128" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">10 000</text>
    
        <line x1="230" y1="390" x2="230" y2="396" stroke="#64748b" />
        <text x="230" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">25 000</text>
    
        <line x1="400" y1="390" x2="400" y2="396" stroke="#64748b" />
        <text x="400" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">50 000</text>
    
        <line x1="740" y1="390" x2="740" y2="396" stroke="#64748b" />
        <text x="740" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">100 000</text>
    

    <!-- Lignes de métriques -->
    <polyline fill="none" stroke="url(#parseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="128,340.2565320452213 230,265.07942411356413 400,156.21753021252948 740,103.04347826086956" />
    <polyline fill="none" stroke="url(#strGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="128,372.0781560162926 230,362.02299602543366 400,324.67103405938997 740,278.86090810103553" />

